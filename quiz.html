<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Quiz Caiçara || Cidade Mãe </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quiz.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="abas">
            <a href="" onclick="history.back(); return false;" class="voltar">🡠</a>

            <div class="bandeiras">
                <img src="imagens/bandeiras-inicio.png" alt="Bandeiras do Brasil, do Paraná e da cidade de Paranaguá">
            </div>

            <img src="imagens/paranagua.png" class="paranagua" alt="Paranaguá">
            <a href="sobre-nos.html" class="btn-sobre"> Sobre Nós </a>

            <div class="usuario" id="container-usuario">
                <a href="perfil.html" style="text-decoration: none;">
                    <div id="perfil-logado" class="perfil-logado" style="display: none;">
                        <span id="nome-usuario" class="nome-perfil"></span>
                        <img id="foto-usuario" src="imagens/usuario.png" alt="Foto de perfil" class="foto-perfil">
                    </div>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="secao-esquerda">
            <div class="conteudo">
                <div class="logo">
                    <img src="imagens/quiz.png" class="logo-img">
                    <div class="titulo">
                        <h1> QUIZ <span> CAIÇARA </span> </h1>
                    </div>
                </div>
                <p class="descricao"> Faça um teste e descubra <br> o quão caiçara você é! </p>
                <a href="perguntas.html">
                    <button class="btn-jogar"> JOGAR </button>
                </a>
            </div>
        </section>

        <section class="secao-direita">
            <img src="imagens/quiz-fundo.png" class="img-quiz">
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuarioLogado = localStorage.getItem('usuarioLogado') || localStorage.getItem('usuario_nome');

            if (!usuarioLogado) {
                sessionStorage.setItem('voltarPara', 'quiz.html');
                
                const modalAviso = document.createElement('div');
                modalAviso.className = 'modal-bloqueio';
                modalAviso.innerHTML = `

<div class="modal-bloqueio-card" style="position: relative;">

    <div class="topo-resultado-botoes">
        <button type="button" class="btn-circulo btn-fechar-bloqueio" title="Voltar">✕</button>
    </div>

    <h2>Acesso Restrito</h2>

    <p>Você precisa estar logado para jogar o Quiz Caiçara!</p>

    <button onclick="window.location.href='cadastro.html'">Fazer Login / Cadastro</button>

</div>

`;
                document.body.appendChild(modalAviso);

                const btnFecharBloqueio = 
                modalAviso.querySelector('.btn-fechar-bloqueio');

                btnFecharBloqueio.addEventListener('click', () => {
                   const origem = 
                sessionStorage.getItem('origemJogo');

                  if (origem && origem !== 'quiz.html') {
                     sessionStorage.removeItem('origemJogo');
                     window.location.href = origem;
                 } else if (document.referrer && !
                document.referrer.includes('quiz.html')) {
                   window.location.href = document.referrer;
                  } else {
                      window.location.href = 'index.html';
                  }
               });
                
                return; 
            }

            const elNome = document.getElementById('nome-usuario');
            const perfilLogado = document.getElementById('perfil-logado');
            const btnUser = document.getElementById('btn-user');

            if (elNome) elNome.textContent = usuarioLogado;
            if (perfilLogado) perfilLogado.style.display = 'flex'; // Mostra o perfil
            if (btnUser) btnUser.style.display = 'none'; // Esconde o "Cadastre-se" (se existir)
        });
    </script>
</body>
</html>
