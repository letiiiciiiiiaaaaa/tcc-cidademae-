<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro | Cidade Mãe </title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <a href="" onclick="history.back(); return false;">
        <button class="voltar"> 🡠 Voltar </button>
    </a>

    <img src="logo.png" class="logo" alt="Logo Cidade Mãe" width="200">
    <h2>Cadastre-se para uma melhor experiência</h1>
    <div class="tela-cadastro">
        <input type="name" placeholder="Nome de usuário" required>
        <br><br>
        <input type="email" placeholder="E-mail" required>
        <br><br>
        <input type="password" placeholder="Senha" required>
        <br><br>
        <div class="data_nascimento">
            <label for="data_nascimento"><b>Data de Nascimento:</b></label>
            <br>
            <input type="date" name="data_nascimento" id="data_nascimento" required>
        </div>
        <br>
        <button type="submit" class="entrar">Criar conta</button>
        <h5>Já possui uma conta?<br><a href="login.html" class="login">Logar-se</a>.</h5>
        <h6>Li e aceito os Termos de Uso e a Política de<br>Privacidade</h6>
    </div>
</body>
</html>
