<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Mercado de Paranaguá</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        .timeline-container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Barra dos Anos */
        .anos-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .btn-ano {
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: #718096;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .btn-ano.ativo,
        .btn-ano:hover {
            background-color: #2b6cb0;
            color: white;
        }

        /* Área de Conteúdo */
        .conteudo-ano img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .conteudo-ano h2 {
            color: #2d3748;
            margin-bottom: 10px;
        }

        .conteudo-ano p {
            color: #4a5568;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="timeline-container">
        <h1>História do Mercado do Café</h1>
        <p style="color: #718096; margin-bottom: 20px;">Navegue pelos anos para ver a evolução do mercado</p>

        <div class="anos-bar">
            <button class="btn-ano ativo" onclick="mudarAno(1914, this)">1914</button>
            <button class="btn-ano" onclick="mudarAno(1980, this)">1980</button>
            <button class="btn-ano" onclick="mudarAno(2024, this)">Hoje</button>
        </div>

        <div class="conteudo-ano">
            <img id="img-linha"
                src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80"
                alt="Mercado">
            <h2 id="titulo-linha">1914 - A Inauguração</h2>
            <p id="texto-linha">O Mercado do Café é oficialmente inaugurado, tornando-se o principal ponto de encontro e
                comércio de produtores caiçaras e pescadores da região.</p>
        </div>
    </div>

    <script>
        // Dados da linha do tempo
        const dadosTimeline = {
            1914: {
                titulo: "1914 - A Inauguração",
                texto: "O Mercado do Café é oficialmente inaugurado, tornando-se o principal ponto de encontro e comércio de produtores caiçaras e pescadores da região.",
                imagem: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80"
            },
            1980: {
                titulo: "1980 - Tombamento Histórico",
                texto: "O conjunto arquitetônico do Mercado e do Centro Histórico ganha reconhecimento e proteção patrimonial, preservando a identidade caiçara.",
                imagem: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80"
            },
            2024: {
                titulo: "Hoje - Polo Gastronômico e Cultural",
                texto: "Atualmente, o mercado é famoso por servir o tradicional Barreado e pratos à base de frutos do mar, sendo parada obrigatória para moradores e turistas.",
                imagem: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80"
            }
        };

        function mudarAno(ano, elemento) {
            // Atualiza visual dos botões
            document.querySelectorAll('.btn-ano').forEach(btn => btn.classList.remove('ativo'));
            elemento.classList.add('ativo');

            // Atualiza o conteúdo na tela
            document.getElementById('titulo-linha').innerText = dadosTimeline[ano].titulo;
            document.getElementById('texto-linha').innerText = dadosTimeline[ano].texto;
            document.getElementById('img-linha').src = dadosTimeline[ano].imagem;
        }
    </script>

</body>

</html>
