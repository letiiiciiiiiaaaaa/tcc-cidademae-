<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amostra - Música Caiçara</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    .card-cultural {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
    }

    h2 {
      color: #2c3e50;
      margin-top: 0;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Ajuste na barra de áudio */
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card-cultural">
    <h2>Cultura Caiçara</h2>
    <p>Ouça uma amostra do ritmo tradicional das comunidades caiçaras.</p>
    
    <!-- Player de áudio nativo -->
    <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
      Seu navegador não suporta o elemento de áudio.
    </audio>
  </div>

</body>
</html>
