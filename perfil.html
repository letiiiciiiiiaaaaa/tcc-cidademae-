<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Cidade Mãe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="cabecalho-verde">
        <a href="" onclick="history.back(); return false;" class="voltar">
            <span style="font-size: 24px;">←</span> Voltar
        </a>
    </header>

    <main class="secao-perfil">
        <img src="imagens/onda-perfil.png" alt="Onda" class="deco onda-deco">
        <img src="imagens/notas-perfil.png" alt="Notas musicais" class="deco notas-deco">

        <section class="perfil-conteudo">
            <div class="foto-perfil-wrapper">
                <img src="imagens/usuario.png" alt="Foto de perfil" class="foto-perfil-grande">
                <img src="imagens/carangua-perfil.png" alt="Caranguejo" class="caranguejo-deco">
            </div>

            <h2 class="perfil-nome" id="nome-perfil">Carregando...</h2>
            <p class="perfil-email" id="email-perfil">Carregando...</p>
            <p class="perfil-bio" id="bio-perfil">Não há biografia</p>

            <div class="botoes-perfil">
                <button class="btn-azul" id="btn-editar-perfil">Editar perfil</button>
                <button class="btn-cinza" id="btn-logout-perfil">Sair da conta</button>
            </div>

            <div class="perfil-stats">
                <!-- BLOCO DO QUIZ CLICÁVEL -->
                <a href="quiz.html" class="stat-item stat-item-clicavel" title="Ir para o Quiz Caiçara">
                    <img src="imagens/quiz-balao.png" alt="Ícone Quiz" class="stat-icon-img">
                    <div class="stat-info">
                        <span class="stat-label">Quiz</span>
                        <span class="stat-valor" id="valor-quiz">VOCÊ É 0% CAIÇARA</span>
                    </div>
                </a>

                <!-- BLOCO DO JOGO DA MEMÓRIA CLICÁVEL -->
                <a href="jogo-memoria.html" class="stat-item stat-item-clicavel" title="Ir para o Jogo da Memória">
                    <img src="imagens/jogo-controle.png" alt="Ícone Jogo" class="stat-icon-img">
                    <div class="stat-info">
                        <span class="stat-label">Jogo da Memória</span>
                        <span class="stat-valor" id="valor-pontuacao">0</span>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <div id="modal-editar" class="modal-overlay" style="display: none;">
        <div class="modal-card-custom">
            <h2>Editar Perfil</h2>
            <p>Atualize as informações do seu perfil abaixo:</p>
            
            <div class="campo-editar">
                <label for="edit-nome">Nome de usuário:</label>
                <input type="text" id="edit-nome" placeholder="Seu nome">
            </div>

            <div class="campo-editar">
                <label for="edit-email">E-mail:</label>
                <input type="email" id="edit-email" placeholder="seuemail@exemplo.com">
            </div>

            <div class="campo-editar">
                <label for="edit-bio">Biografia:</label>
                <textarea id="edit-bio" placeholder="Escreva um pouco sobre você..."></textarea>
            </div>

            <div class="botoes-modal-custom">
                <button type="button" id="btn-cancelar-editar" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btn-salvar-editar" class="btn-modal-ok">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-logout" class="modal-overlay" style="display: none;">
        <div class="modal-card-custom">
            <h2>Sair da Conta</h2>
            <p>Deseja realmente encerrar sua sessão?</p>
            
            <div class="botoes-modal-custom">
                <button type="button" id="btn-cancelar-logout" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btn-confirmar-logout" class="btn-modal-ok" style="background-color: #ff3131;">Sair</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yehhopwozpguzhgioztv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_65-1hzodlk2BYCAzg5SgHg_xuILMBb2";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
        document.addEventListener('DOMContentLoaded', async () => {
            let usuarioId = localStorage.getItem('usuario_id');
            let nomeLocal = localStorage.getItem('usuario_nome') || localStorage.getItem('usuarioLogado');
            let emailLocal = localStorage.getItem('usuario_email');
            let bioLocal = localStorage.getItem('usuario_bio');
    
            const elNome = document.getElementById('nome-perfil');
            const elEmail = document.getElementById('email-perfil');
            const elBio = document.getElementById('bio-perfil');
            const elPontuacao = document.getElementById('valor-pontuacao');
            const elQuiz = document.getElementById('valor-quiz');
    
            const modalEditar = document.getElementById('modal-editar');
            const modalLogout = document.getElementById('modal-logout');
            const editNome = document.getElementById('edit-nome');
            const editEmail = document.getElementById('edit-email');
            const editBio = document.getElementById('edit-bio');
            const btnSalvar = document.getElementById('btn-salvar-editar');
    
            function configurarBio(textoBio) {
                if (textoBio && textoBio.trim() !== '' && textoBio !== 'null' && textoBio !== 'undefined') {
                    elBio.textContent = textoBio;
                    elBio.classList.remove('bio-vazia');
                } else {
                    elBio.textContent = "Não há biografia";
                    elBio.classList.add('bio-vazia');
                }
            }
    
            elNome.textContent = nomeLocal || 'Usuário';
            elEmail.textContent = emailLocal || 'Insira seu e-mail editando o perfil';
            configurarBio(bioLocal);
            elPontuacao.textContent = localStorage.getItem('maiorPontuacao') || '0';
            elQuiz.textContent = `VOCÊ É ${localStorage.getItem('maiorPorcentagemQuiz') || '0'}% CAIÇARA`;
    
            async function carregarDadosBanco() {
                if (!nomeLocal && (!usuarioId || usuarioId === "undefined")) return;
    
                try {
                    let query = supabaseClient.from('usuarios').select('*');
    
                    if (usuarioId && usuarioId !== "undefined") {
                        query = query.eq('idusuarios', usuarioId);
                    } else if (nomeLocal) {
                        query = query.eq('nome', nomeLocal);
                    }
    
                    const { data, error } = await query.maybeSingle();
    
                    if (data && !error) {
                        if (data.idusuarios) {
                            usuarioId = data.idusuarios;
                            localStorage.setItem('usuario_id', data.idusuarios);
                        }
    
                        if (data.nome) {
                            elNome.textContent = data.nome;
                            localStorage.setItem('usuario_nome', data.nome);
                            localStorage.setItem('usuarioLogado', data.nome);
                            nomeLocal = data.nome;
                        }
    
                        if (data.email) {
                            elEmail.textContent = data.email;
                            localStorage.setItem('usuario_email', data.email);
                        } else {
                            localStorage.removeItem('usuario_email');
                        }
    
                        if (data.bio !== undefined && data.bio !== null && data.bio.trim() !== '') {
                            configurarBio(data.bio);
                            localStorage.setItem('usuario_bio', data.bio);
                        } else {
                            configurarBio('');
                            localStorage.removeItem('usuario_bio');
                        }
    
                        if (data.jogo_pontos !== undefined && data.jogo_pontos !== null) {
                            elPontuacao.textContent = data.jogo_pontos;
                            localStorage.setItem('maiorPontuacao', data.jogo_pontos);
                        } else {
                            elPontuacao.textContent = '0';
                            localStorage.setItem('maiorPontuacao', '0');
                        }
    
                        if (data.quiz_pontos !== undefined && data.quiz_pontos !== null) {
                            elQuiz.textContent = `VOCÊ É ${data.quiz_pontos}% CAIÇARA`;
                            localStorage.setItem('maiorPorcentagemQuiz', data.quiz_pontos);
                        } else {
                            elQuiz.textContent = `VOCÊ É 0% CAIÇARA`;
                            localStorage.setItem('maiorPorcentagemQuiz', '0');
                        }
                    }
                } catch (err) {
                    console.error("Erro ao carregar dados do Supabase:", err);
                }
            }
    
            await carregarDadosBanco();
    
            // Abrir Modal de Edição
            document.getElementById('btn-editar-perfil').addEventListener('click', () => {
                editNome.value = elNome.textContent !== 'Usuário' ? elNome.textContent : '';
                editEmail.value = elEmail.textContent.includes('@') ? elEmail.textContent : '';
                editBio.value = elBio.classList.contains('bio-vazia') ? '' : elBio.textContent;
    
                modalEditar.style.display = 'flex';
            });
    
            // Cancelar Edição
            document.getElementById('btn-cancelar-editar').addEventListener('click', () => {
                modalEditar.style.display = 'none';
            });
    
            // Salvar Alterações
            btnSalvar.addEventListener('click', async () => {
                const novoNome = editNome.value.trim();
                const novoEmail = editEmail.value.trim();
                const novaBio = editBio.value.trim();
    
                if (!novoNome) {
                    alert("O nome de usuário não pode ficar vazio!");
                    return;
                }
    
                btnSalvar.textContent = "Salvando...";
                btnSalvar.disabled = true;
    
                const nomeAntigo = nomeLocal;
    
                elNome.textContent = novoNome;
                if (novoEmail) elEmail.textContent = novoEmail;
                configurarBio(novaBio);
    
                localStorage.setItem('usuario_nome', novoNome);
                localStorage.setItem('usuarioLogado', novoNome);
                
                if (novoEmail) localStorage.setItem('usuario_email', novoEmail);
                else localStorage.removeItem('usuario_email');
    
                if (novaBio) localStorage.setItem('usuario_bio', novaBio);
                else localStorage.removeItem('usuario_bio');
    
                nomeLocal = novoNome;
    
                try {
                    const dadosAtualizar = {
                        nome: novoNome,
                        bio: novaBio
                    };
                    if (novoEmail) dadosAtualizar.email = novoEmail;
    
                    let res = null;
    
                    if (usuarioId && usuarioId !== "undefined") {
                        res = await supabaseClient
                            .from('usuarios')
                            .update(dadosAtualizar)
                            .eq('idusuarios', usuarioId);
                    } else if (nomeAntigo) {
                        res = await supabaseClient
                            .from('usuarios')
                            .update(dadosAtualizar)
                            .eq('nome', nomeAntigo);
                    }
    
                    if (res && res.error) {
                        console.error("Erro ao atualizar Supabase:", res.error);
                    }
                } catch (err) {
                    console.error("Erro na requisição:", err);
                } finally {
                    btnSalvar.textContent = "Salvar";
                    btnSalvar.disabled = false;
                    modalEditar.style.display = 'none';
                }
            });
    
            // Modal Logout
            document.getElementById('btn-logout-perfil').addEventListener('click', () => {
                modalLogout.style.display = 'flex';
            });
    
            document.getElementById('btn-cancelar-logout').addEventListener('click', () => {
                modalLogout.style.display = 'none';
            });
    
            // CONFIRMAR LOGOUT: Limpa absolutamente todas as informações do usuário atual
            document.getElementById('btn-confirmar-logout').addEventListener('click', () => {
                localStorage.removeItem('usuario_nome');
                localStorage.removeItem('usuarioLogado');
                localStorage.removeItem('usuario_id');
                localStorage.removeItem('usuario_email');
                localStorage.removeItem('usuario_bio');
                localStorage.removeItem('maiorPontuacao');
                localStorage.removeItem('maiorPorcentagemQuiz');
    
                let voltarPara = sessionStorage.getItem('paginaAnteriorPerfil');
    
                if (!voltarPara || voltarPara.includes('perfil.html')) {
                    voltarPara = 'index.html';
                }
    
                window.location.href = voltarPara;
            });
        });
    </script>
</body>
</html>
